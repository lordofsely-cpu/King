name: Build Sely APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sely Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare Sely project
        shell: bash
        run: |
          set -e

          if [ -f "SelyApp-fixed.zip" ]; then
            echo "Found SelyApp-fixed.zip"
            rm -rf project
            mkdir project
            unzip -q -o "SelyApp-fixed.zip" -d project
            cd project

            # Handle a possible extra folder inside the ZIP
            if [ ! -f "app/build.gradle" ]; then
              FOUND=$(find . -mindepth 2 -maxdepth 3 -path "*/app/build.gradle" -print -quit)
              if [ -n "$FOUND" ]; then
                ROOT=$(dirname "$(dirname "$FOUND")")
                cp -a "$ROOT"/. .
              fi
            fi
          else
            echo "No SelyApp-fixed.zip found."
            echo "Using the repository itself as the Android project."
            mkdir -p project
            cp -a . project/
            cd project
          fi

          test -f settings.gradle
          test -f app/build.gradle

          echo "Android project found:"
          pwd
          ls -la
          ls -la app

      - name: Enable AndroidX
        working-directory: project
        run: |
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: project
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sely APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
